name: scheduletool
services:
  scheduletool:
    image: scheduletool:${APP_VERSION:-0.2.0}
    build:
      context: .
      dockerfile: Dockerfile.runtime
      args:
        JAVA_IMAGE: ${JAVA_IMAGE:-mcr.microsoft.com/openjdk/jdk:21-ubuntu}
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL:?required}
      DB_USER: ${DB_USER:?required}
      DB_PASSWORD: ${DB_PASSWORD:?required}
      APP_USERNAME: ${APP_USERNAME:-admin}
      APP_PASSWORD_HASH: ${APP_PASSWORD_HASH:?required}
      APP_WEB_AUTO_LOGIN: ${APP_WEB_AUTO_LOGIN:-false}
      COOKIE_SECURE: "true"
      SPRING_FLYWAY_ENABLED: "false"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      LOG_DIR: /app/logs
    volumes: [scheduletool-logs:/app/logs]
    networks:
      caddy-proxy: {}
      mysql_default:
        ipv4_address: ${MYSQL_IPV4:?required}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 768m
    healthcheck:
      test: [CMD, bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /schedule/health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && read -r status <&3 && [[ "$$status" == HTTP/*" 200"* ]]']
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
networks:
  caddy-proxy:
    external: true
    name: ${PROXY_NETWORK:-caddy-proxy}
  mysql_default:
    external: true
    name: ${MYSQL_NETWORK:-mysql_default}
volumes:
  scheduletool-logs:
