spring.application.name=ScheduleTool
server.address=${APP_BIND:127.0.0.1}
server.port=${APP_PORT:18080}
server.servlet.context-path=${APP_CONTEXT:/schedule}
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/scheduletool_dev?sslMode=REQUIRED&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USER:scheduletool_app}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.user=${DB_MIGRATION_USER:${spring.datasource.username}}
spring.flyway.password=${DB_MIGRATION_PASSWORD:${spring.datasource.password}}
spring.flyway.clean-disabled=true
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Asia/Shanghai
spring.mvc.problemdetails.enabled=true
spring.servlet.multipart.enabled=false
server.tomcat.max-http-form-post-size=64KB
app.username=${APP_USERNAME:admin}
app.password-hash=${APP_PASSWORD_HASH:}
app.cookie-secure=${COOKIE_SECURE:false}
app.session-hours=24
springdoc.api-docs.path=/api/openapi
springdoc.swagger-ui.path=/api/docs
springdoc.swagger-ui.disable-swagger-default-url=true
logging.file.name=${LOG_DIR:.local/logs}/runtime.log
logging.logback.rollingpolicy.file-name-pattern=${LOG_DIR:.local/logs}/runtime.%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=300MB
logging.pattern.level=%5p [request:%X{requestId:-system}]
app.mcp.enabled=${MCP_ENABLED:false}
app.mcp.issuer=${MCP_ISSUER:}
app.mcp.resource=${MCP_RESOURCE:${app.mcp.issuer}/mcp}
app.mcp.client-id=${MCP_CLIENT_ID:scheduletool-chatgpt}
app.mcp.client-secret-hash=${MCP_CLIENT_SECRET_HASH:}
app.mcp.redirect-uris=${MCP_REDIRECT_URIS:}
app.mcp.signing-key-file=${MCP_SIGNING_KEY_FILE:}
app.mcp.api-base=${MCP_API_BASE:http://127.0.0.1:${server.port}${server.servlet.context-path}}
app.mcp.api-password-file=${MCP_API_PASSWORD_FILE:}
app.mcp.allowed-origins=${MCP_ALLOWED_ORIGINS:}
app.mcp.allowed-hosts=${MCP_ALLOWED_HOSTS:}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=15m
logging.level.io.modelcontextprotocol.server.transport.HttpServletStatelessServerTransport=OFF
